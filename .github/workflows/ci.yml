name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        san: ["", thread, address]
    name: build+test ${{ matrix.san || 'plain' }}
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/setup.sh
      # TSan crashes on 24.04's high-entropy ASLR; lower it for the run.
      - if: matrix.san == 'thread'
        run: sudo sysctl vm.mmap_rnd_bits=28
      - run: make SAN=${{ matrix.san }}
      - run: make SAN=${{ matrix.san }} test
      - run: ./tests/e2e.sh build${{ matrix.san && format('-{0}', matrix.san) || '' }}/pipe-chunk
      # Tiny benchmark runs and plots so the bench scripts keep working; the numbers are not used.
      - if: matrix.san == ''
        run: |
          SIZE=4M RUNS=2 QUEUES="1 4 16" WORKERS="1 2 4" BLOCKS="4K 64K" ./bench/sweep.sh
          SIZES="1M 2M" RUNS=1 OUT_RATE=50 ./bench/memory.sh
          SIZE=8M PIPE_SIZE=4M PIPE_RATE=50 RUNS=1 ./bench/io.sh
          ./bench/plot.py
